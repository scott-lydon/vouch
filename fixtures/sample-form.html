<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vouch fixture — sample form</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #0f172a; }
  h1 { font-size: 1.5em; margin-bottom: 16px; }
  form > div { margin-bottom: 14px; }
  label { display: block; font-size: 0.9em; margin-bottom: 4px; color: #475569; }
  input[type=email], input[type=password], input[type=text], select { width: 100%; padding: 8px 10px; font-size: 1em; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
  button { background: #6366f1; color: white; border: none; padding: 10px 18px; font-size: 1em; border-radius: 6px; cursor: pointer; }
  button:hover { background: #4f46e5; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .msg { padding: 10px; border-radius: 6px; margin-top: 16px; }
  .msg.success { background: #dcfce7; color: #166534; }
  .msg.error { background: #fee2e2; color: #991b1b; }
  #counter { margin-top: 16px; color: #64748b; font-size: 0.9em; }
</style>
</head>
<body>

<h1>Sample form (Vouch fixture)</h1>
<p style="color: #64748b; font-size: 0.9em;">This page is intentionally small. It exists so Vouch has a deterministic local target to map, plan, and execute against on the first run.</p>

<form id="signup-form" data-testid="signup-form">
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" data-testid="email-input" placeholder="you@example.com" required>
  </div>

  <div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" data-testid="password-input" placeholder="At least 8 chars" required minlength="8">
  </div>

  <div>
    <label for="country">Country</label>
    <select id="country" name="country" data-testid="country-select">
      <option value="">Pick one</option>
      <option value="US">United States</option>
      <option value="CA">Canada</option>
      <option value="UK">United Kingdom</option>
    </select>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="terms" name="terms" data-testid="terms-checkbox">
    <label for="terms" style="margin: 0;">I agree to the terms</label>
  </div>

  <div>
    <button type="submit" data-testid="submit-button">Sign up</button>
    <button type="button" id="reset-btn" data-testid="reset-button" style="background:#e2e8f0;color:#475569;margin-left:6px;">Reset</button>
  </div>
</form>

<div id="msg-area"></div>
<div id="counter">Form attempts: <span id="attempts">0</span></div>

<script>
  let attempts = 0;
  const $msg = document.getElementById('msg-area');
  const $counter = document.getElementById('attempts');
  document.getElementById('signup-form').addEventListener('submit', (e) => {
    e.preventDefault();
    attempts += 1;
    $counter.textContent = attempts;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const country = document.getElementById('country').value;
    const terms = document.getElementById('terms').checked;
    if (!email || !password || password.length < 8 || !country || !terms) {
      $msg.innerHTML = '<div class="msg error" data-testid="error-msg">Please fix the fields above before submitting.</div>';
    } else {
      $msg.innerHTML = '<div class="msg success" data-testid="success-msg">Account created! Welcome, ' + email + '.</div>';
    }
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('signup-form').reset();
    $msg.innerHTML = '';
  });
</script>

</body>
</html>
